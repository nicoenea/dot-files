# AMD RX 9070 XT (amdgpu / Mesa / RADV).
# Never reintroduce __GLX_VENDOR_LIBRARY_NAME or NVD_BACKEND — NVIDIA-only, and
# they break GLX/VA-API on this box.
LIBVA_DRIVER_NAME=radeonsi
ELECTRON_OZONE_PLATFORM_HINT=auto

# Mesa defaults this cache to 1 GB, which a large Steam library blows through.
# Once it evicts, shaders recompile mid-game and you get stutter that looks like
# a performance problem but is just cache thrash. Cheap to raise; costs disk only.
MESA_SHADER_CACHE_MAX_SIZE=12G

# Fedora's chromium-browser wrapper replaces its system flags (/etc/chromium/chromium.conf)
# with this var, so the distro's feature lists are repeated here. WaylandWpColorManagerV1
# is the addition: Chromium's Wayland color management washes popups (address-bar
# dropdown) out to translucent grey on Hyprland 0.51. Brave gets it via brave-flags.conf.
CHROMIUM_USER_FLAGS=--disable-features=LensOverlay,OptimizationGuideOnDeviceModel,PromptAPIForGeminiNano,Compose,TabOrganization,WaylandWpColorManagerV1 --enable-features=AllowQt,WaylandLinuxDrmSyncobj,WaylandPerSurfaceScale,WaylandUiScale,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder
